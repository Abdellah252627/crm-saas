name: backend-ci

on:
  push:
    paths:
      - "backend/**"
      - ".github/workflows/backend-ci.yml"
  pull_request:
    paths:
      - "backend/**"
      - ".github/workflows/backend-ci.yml"

defaults:
  run:
    working-directory: backend

jobs:
  verify:
    name: Typecheck and unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npm run prisma:generate

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test

  e2e:
    name: Newman end-to-end suite
    runs-on: ubuntu-latest
    # Needs a reachable PostgreSQL database and a booted API, so it only runs when
    # the repository secrets are configured rather than on every push.
    if: ${{ vars.E2E_ENABLED == 'true' }}
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: crm_saas
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/crm_saas
      DIRECT_URL: postgresql://postgres:postgres@localhost:5432/crm_saas
      JWT_SECRET: ci_only_secret_value_that_is_definitely_long_enough
      JWT_EXPIRES_IN: 15m
      PORT: "4000"
      NODE_ENV: production
      CORS_ORIGIN: http://localhost:5173
      RATE_LIMIT_ENABLED: "true"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Apply migrations
        run: npm run prisma:deploy

      - name: Boot API
        run: npm run build && npm start &

      - name: Wait for API
        run: |
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:4000/health; then exit 0; fi
            sleep 1
          done
          echo "API did not become ready" && exit 1

      - name: Run Newman suite
        run: npm run test:e2e